# Builds the docs and publishes them on GitHub Pages of the public repository
# danwos/deciwa.docs – the code in this repository stays private.
#
# The public build is an offline review build: visitors can try deciwa right
# on these pages – their review stays in their own browser – and no review
# data from .deciwa/ is shipped.
#
# Needs in this repository: the secret DOCS_DEPLOY_KEY (private SSH key whose
# public half is a deploy key with write access on the docs repository).
# Optional: the variable DOCS_REPOSITORY ("owner/name" or just "name") to
# publish somewhere else.

name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install graphviz (needflow diagrams)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the packages and the docs tools
        run: uv sync --locked

      - name: Check the docs (warnings fail)
        run: |
          uv run sphinx-build -W -E -q -b html docs docs/_build/check
          uv run sphinx-build -W -E -q -b html -D language=de docs docs/_build/check-de

      - name: Translation status (German)
        run: uv run sphinx-intl stat -d docs/locales -l de | grep -v " 0 fuzzy, 0 untranslated" || true

      - name: Build the public review build (English at the root, German in de/)
        run: |
          uv run sphinx-build -E -q -b html \
            -D deciwa_mode=offline -D deciwa_offline_annotations=0 \
            docs docs/_build/site
          uv run sphinx-build -E -q -b html -D language=de \
            -D deciwa_mode=offline -D deciwa_offline_annotations=0 \
            docs docs/_build/site/de

      - name: Resolve the docs repository
        id: target
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REPO: ${{ vars.DOCS_REPOSITORY || 'danwos/deciwa.docs' }}
        run: |
          # "deciwa.docs" alone means: in the same account as this repository
          case "$REPO" in */*) ;; *) REPO="${{ github.repository_owner }}/$REPO" ;; esac
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "publishing to $REPO"

      - name: Publish to the docs repository (gh-pages branch)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: ${{ steps.target.outputs.repo }}
          publish_branch: gh-pages
          publish_dir: docs/_build/site
          force_orphan: true
          cname: deciwa.danwos.dev   # custom domain – written on every deploy, or force_orphan would drop it
          user_name: deciwa docs bot
          user_email: actions@users.noreply.github.com
          full_commit_message: "docs from danwos/deciwa@${{ github.sha }}"
