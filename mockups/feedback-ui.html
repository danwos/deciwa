Logging requirements
====================

This chapter collects the requirements for audit logging in the
fleet backend. It is reviewed before every release.

.. req:: Log every configuration change
   :id: REQ_001
   :status: open
   :tags: audit, logging

   The system shall write a log entry for every change of the
   configuration, including user, time, old and new value.

.. req:: Keep logs for 30 days
   :id: REQ_002
   :status: open
   :links: REQ_001

   Log entries shall be kept for at least 30 days and then be
   deleted automatically.

Storage
-------

Logs are stored in the central log service. Access is limited
to operators and auditors.

.. spec:: Write logs as JSON lines
   :id: SPEC_001
   :links: REQ_001

   Each log entry is one JSON object per line with the fields
   ``ts``, ``user``, ``key``, ``old`` and ``new``.

# Getting started

deciwa keeps feedback on your docs next to the docs, without
touching the source files.

## Install

Install the CLI with pipx:

```bash
pipx install deciwa
```

## First review

- Run `deciwa elements guide.md` to see what deciwa can point at.
- Open the file in VS Code and hover over a paragraph.
- Click it and choose approve, rephrase or more details.

Every verdict lands in `.deciwa/` and can be committed with Git.

"""Load and validate the deciwa configuration."""

import json
from pathlib import Path

DEFAULT_PATH = Path(".deciwa/config.json")


class ConfigError(Exception):
    """Raised when the configuration is invalid."""


class Config:
    """Settings for one repository."""

    def __init__(self, backend: str, reviewers: list[str]):
        self.backend = backend
        self.reviewers = reviewers

    def is_hosted(self) -> bool:
        """Return True if annotations are stored in the hosted service."""
        return self.backend.startswith("https://")


def load_config(path: Path = DEFAULT_PATH) -> Config:
    """Read the config file and return a Config.

    Falls back to local storage if the file does not exist.
    """
    if not path.exists():
        return Config(backend="local", reviewers=[])

/* ---------- geometry: one API for source lines and rendered DOM ---------- */
const cur = () => fileBy(S.file);

/* ---------- rendering ---------- */
function hlSegment(s, f) {

  } else if (f.lang === 'md') {

    if (/^#{1,6}\s/.test(t)) return 'l-h';

}

  } else html = hlSegment(t, f);

}

}

/* ---------- saving ---------- */

    toast('A note needs a comment'); return;
  }
  if (kind === 'request' && !comment) { if (cmtEl) cmtEl.focus(); toast('Write the question into the comment field'); return; }
  const loc = locate(t), a = ACTS[kind] || { verdict: 'request' };
  const ann = { id: 'a' + Date.now(), file: t.file, selector: t.selector, kind: t.kind, label: t.label, author: 'daniel', status: 'open', created: today(), verdict: a.verdict, fingerprint: hash(loc ? loc.text : '') };
  if (a.action) ann.action = a.action;

  if (t.exact) Object.assign(ann, { exact: t.exact, prefix: t.prefix, suffix: t.suffix });
  if (kind === 'request') ann.to = $('#askTo') ? $('#askTo').value : 'daniel';
  if (['approve', 'change', 'reject', 'freeze'].includes(ann.verdict)) {
    S.anns.forEach(o => { if (o.file === t.file && keyOf(o) === keyOf(t) && o.status === 'open' && o.verdict !== 'note') o.status = 'resolved'; });

  S.anns.push(ann); persist();
  toast(`${a.label || 'Request'} saved → .deciwa/annotations/${fileBy(t.file).path}.json`);
  if (S.review) { closeUI(); renderAll(); reviewStep(1); return; }
  if (S.variant === 'A') closeUI();
  renderAll();
}

/* ---------- events ---------- */

    const e = f.els.filter(x => x.start <= k && x.end >= k).sort((a, b) => (a.end - a.start) - (b.end - b.start) || b.id - a.id)[0];

}

});

        const n = anchor && anchor.closest('[data-el]'); if (!n) return;
        e = f.els[+n.dataset.el];
        while (e && !norm(elText(f, e)).includes(norm(exact)) && e.parent != null) e = f.els[e.parent];
      }
      if (!exact || !e) return;
      const txt = elText(f, e), i = txt.indexOf(exact);
      openUI({ file: S.file, selector: e.selector, kind: e.kind, label: e.label, exact, prefix: i >= 0 ? txt.slice(Math.max(0, i - 20), i) : '', suffix: i >= 0 ? txt.slice(i + exact.length, i + exact.length + 20) : '' });
      renderEditor();
      return;
    }
    const e = hoverEl(); if (e) openUI(targetFromEl(e));
  }, 0);
});

document.addEventListener('click', ev => {
  const t = ev.target;
  const v = t.closest('[data-v]'); if (v) { closeUI(); S.variant = v.dataset.v; persist(); renderAll(); return; }
  const md = t.closest('[data-mode]'); if (md) { if (md.disabled) return; closeUI(); S.mode[S.file] = md.dataset.mode; persist(); renderAll(); return; }
  const fi = t.closest('[data-file]'); if (fi) { closeUI(); S.file = fi.dataset.file; S.review = null; persist(); $('#editor').scrollTop = 0; renderAll(); return; }
  const st = t.closest('[data-star]'); if (st) { setRating(+st.dataset.star); return; }
  const act = t.closest('[data-act]'); if (act) { save(act.dataset.act); return; }
  if (t.closest('[data-close]')) { closeUI(); return; }
  const ai = t.closest('.aitem'); if (ai) { focusAnn(ai.dataset.ann); return; }
  if (t.closest('[data-mclose]') || t.id === 'modal') { $('#modal').classList.remove('on'); return; }
});
document.addEventListener('mousedown', ev => {
  const t = ev.target;
  if (S.variant === 'A' && $('#card').classList.contains('on') && !t.closest('#card') && !t.closest('#view') && !t.closest('aside')) closeUI();
});
function showStars(n) {
  S.rating = n;
  document.querySelectorAll('[data-star]').forEach(b => b.classList.toggle('on', +b.dataset.star <= S.rating));
}
// Quality is independent of feedback: a star click saves the rating right away and keeps the card open.
function setRating(n) {
  const t = S.target; if (!t) return;
  S.anns = S.anns.filter(a => !(a.file === t.file && keyOf(a) === keyOf(t) && a.verdict === 'rating' && a.author === 'daniel'));
  const loc = locate(t);
  const ann = { id: 'a' + Date.now(), file: t.file, selector: t.selector, kind: t.kind, label: t.label, author: 'daniel', status: 'open', created: today(), verdict: 'rating', rating: n, fingerprint: hash(loc ? loc.text : '') };
  if (t.exact) Object.assign(ann, { exact: t.exact, prefix: t.prefix, suffix: t.suffix });
  S.anns.push(ann); persist();
  showStars(n); renderPanel(); renderNav();
  toast(`Rated ${'★'.repeat(n)} – independent of approval`);
}
function focusAnn(id) {
  const a = S.anns.find(x => x.id === id); if (!a) return;
  if (a.file !== S.file) { S.file = a.file; renderAll(); }
  const loc = locate(a);
  if (!loc) { toast('Element not found any more – deciwa would offer to relink it'); return; }
  const t = { file: a.file, selector: a.selector, kind: a.kind, label: a.label };
  if (a.exact) Object.assign(t, { exact: a.exact, prefix: a.prefix, suffix: a.suffix });
  const r = rectOfTarget(t); if (r) $('#editor').scrollTop = Math.max(0, r.top - 120);
  setTimeout(() => openUI(t), 30);
}

document.addEventListener('keydown', e => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === 'Alt') {
    e.preventDefault();
    if (!typing && S.hoverBase != null) { const h = hoverEl(); if (h && h.parent != null) S.level++; updateHover(); }
    return;
  }
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'Escape') { if (S.review) stopReview(); else if (uiOpen()) closeUI(); else $('#modal').classList.remove('on'); return; }
  if (S.target && uiOpen()) {
    const k = ACT_ORDER.find(x => ACTS[x].key === e.key);
    if (k) { e.preventDefault(); save(k); return; }
    if (/^[1-5]$/.test(e.key)) { setRating(+e.key); return; }
  }
  if (e.key === 'v') { S.review ? stopReview() : startReview(); return; }
  if (S.review && (e.key === 'j' || e.key === 'k')) { closeUI(); reviewStep(e.key === 'j' ? 1 : -1); }
});
document.addEventListener('keyup', e => { if (e.key === 'Alt') e.preventDefault(); });
window.addEventListener('resize', () => { renderBars(); positionFocus(); updateHover(); });

$('#btnReview').onclick = () => S.review ? stopReview() : startReview();
$('#btnReset').onclick = () => { S.anns = seed(); S.mode = {}; closeUI(); S.review = null; persist(); renderAll(); toast('Example data restored'); };
$('#btnTheme').onclick = () => {
  const r = document.documentElement, t = r.dataset.theme === 'dark' ? 'light' : 'dark';
  r.dataset.theme = t; try { localStorage.setItem(STORE + '-theme', t); } catch (e) {}
};
$('#btnJson').onclick = () => {
  const f = cur();
  const doc = { deciwa: '0.1', source: f.path, annotations: S.anns.filter(a => a.file === f.name).map(a => {
    const [ns, kind, ...rest] = a.selector.split(':');
    const sels = [{ type: ns + ':' + kind, value: rest.join(':') }];
    if (a.exact) sels.push({ type: 'TextQuoteSelector', exact: a.exact, prefix: a.prefix, suffix: a.suffix });
    const o = { id: a.id, target: { selectors: sels, fingerprint: a.fingerprint }, author: a.author, created: a.created, verdict: a.verdict };
    ['action', 'rating', 'comment', 'to', 'status'].forEach(k => { if (a[k] != null) o[k] = a[k]; });
    o.state = annState(a) + '  (computed, not stored)';
    return o;
  }) };
  $('#mTitle').textContent = '.deciwa/annotations/' + f.path + '.json';
  $('#mBody').textContent = JSON.stringify(doc, null, 2);
  $('#modal').classList.add('on');
};

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

/* fixed states for screenshots: ?clean&theme=light&file=…&mode=…&variant=…&open=<selector>&rating=3&comment=… */
const Q = new URLSearchParams(location.search);
if (Q.has('clean')) { S.anns = seed(); S.mode = {}; }
if (Q.has('shot')) document.body.classList.add('shot');
if (Q.get('theme')) document.documentElement.dataset.theme = Q.get('theme');
if (Q.get('file')) S.file = Q.get('file');
if (Q.get('variant')) S.variant = Q.get('variant');
if (Q.get('mode')) S.mode[S.file] = Q.get('mode');

renderAll();
document.fonts && document.fonts.ready.then(() => {
  renderBars(); positionFocus();
  const e = Q.get('open') && elBySel(cur(), Q.get('open'));
  if (e) {
    const r = rectOfEl(e); if (r) $('#editor').scrollTop = Math.max(0, r.top - (+Q.get('above') || 80));
    openUI(targetFromEl(e));
    if (Q.get('rating')) showStars(+Q.get('rating'));
    if (Q.get('comment')) $('#cmt').value = Q.get('comment');
    if (Q.get('scroll') != null) $('#editor').scrollTop = +Q.get('scroll');
    positionFocus();
  }
  if (Q.get('demo')) runDemo(Q.get('demo'));
});
</script>

<!-- ?demo=de|en plays a scripted walk-through with a visible cursor and captions (used to record the product video) -->
<style>
  #dcursor { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; width: 26px; height: 26px; transform: translate(-3px, -2px); }
  #dcursor .ring { position: absolute; left: -14px; top: -14px; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--hover); opacity: 0; }
  #dcursor .ring.on { animation: ring .45s ease-out; }
  @keyframes ring { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.4); } }
  #dcap { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 99; max-width: 760px; text-align: center; padding: 10px 22px; border-radius: 14px; background: #1B1A22; color: #fff; border: 2px solid #fff; box-shadow: 3px 3px 0 #0F766E; font: 700 21px/1.3 "Bricolage Grotesque", system-ui, sans-serif; opacity: 0; transition: opacity .3s; }
  #dcap.on { opacity: 1; }
  #dend { position: fixed; inset: 0; z-index: 101; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--bg); opacity: 0; transition: opacity .6s; pointer-events: none; }
  #dend.on { opacity: 1; }
  #dend img { width: 200px; height: 200px; }
  #dend b { font: 800 54px "Bricolage Grotesque", system-ui, sans-serif; }
  #dend span { font: 600 22px "JetBrains Mono", ui-monospace, monospace; color: var(--primary); }
  #dend small { margin-top: 14px; font: 400 17px Inter, system-ui, sans-serif; color: var(--muted); }
</style>
<script>
async function runDemo(lang) {
  const TXT = {
    de: {
      point: 'Zeig auf eine Stelle – direkt im Ergebnis.',
      feedback: 'Feedback geben: ein Klick sagt, was passieren soll.',
      typedRephrase: 'Kürzer – ein Gedanke pro Satz.',
      quality: 'Qualität einschätzen – ganz unabhängig davon.',
      ask: 'Die KI fragt – du antwortest direkt an der Stelle.',
      typedAnswer: 'Ja, ein Satz zu Freeze passt hier gut.',
      stale: 'Bestätigt bleibt bestätigt – bis sich der Text ändert.',
      freeze: 'Freeze: Ändert sich der Text doch, schlägt deciwa Alarm.',
      end: 'Feedback, Qualität und Fragen der KI – an einem Ort.',
    },
    en: {
      point: 'Point at a spot – right on the result.',
      feedback: 'Give feedback: one click says what should happen.',
      typedRephrase: 'Shorter – one idea per sentence.',
      quality: 'Rate the quality – completely separate from that.',
      ask: 'The AI asks – you answer right at the spot.',
      typedAnswer: 'Yes, one sentence about freeze fits well here.',
      stale: 'Approved stays approved – until the text changes.',
      freeze: 'Freeze: if the text changes anyway, deciwa raises the alarm.',
      end: 'Feedback, quality and the AI\'s questions – in one place.',
    },
  }[lang] || {};
  window.__demoDone = false;
  document.body.classList.add('shot');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const frame = () => new Promise(r => requestAnimationFrame(r));

  const pointer = document.createElement('div');
  pointer.id = 'dcursor';
  pointer.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 2l7.5 19 2.6-7.7L21 10.8z" fill="#fff" stroke="#1B1A22" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="ring"></div>';
  document.body.append(pointer);
  const cap = document.createElement('div'); cap.id = 'dcap'; document.body.append(cap);
  let x = innerWidth * .55, y = innerHeight * .45;
  const place = () => { pointer.style.left = x + 'px'; pointer.style.top = y + 'px'; };
  place();

  async function caption(text, hold = 0) {
    cap.classList.remove('on'); await sleep(250);
    cap.textContent = text; cap.classList.add('on'); await sleep(hold);
  }
  async function move(tx, ty, ms = 650) {
    const sx = x, sy = y, t0 = performance.now();
    for (;;) {
      const p = Math.min(1, (performance.now() - t0) / ms), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      x = sx + (tx - sx) * e; y = sy + (ty - sy) * e; place();
      const el = document.elementFromPoint(x, y);
      if (el) el.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: x, clientY: y }));
      if (p >= 1) break;
      await frame();
    }
  }
  function ensureVisible(el) {
    const ed = $('#editor');
    if (!ed.contains(el)) return;
    const r = el.getBoundingClientRect(), er = ed.getBoundingClientRect();
    if (r.top < er.top + 50 || r.bottom > er.bottom - 120) ed.scrollTop += r.top - er.top - 90;
  }
  async function to(el, fx = .3, fy = .5, ms) {
    ensureVisible(el); await frame();
    const r = el.getBoundingClientRect();
    await move(r.left + r.width * fx, r.top + r.height * fy, ms);
    return el;
  }
  async function click() {
    const ring = pointer.querySelector('.ring');
    ring.classList.remove('on'); void ring.offsetWidth; ring.classList.add('on');
    const el = document.elementFromPoint(x, y);
    const o = { bubbles: true, clientX: x, clientY: y };
    el.dispatchEvent(new MouseEvent('mousedown', o));
    el.dispatchEvent(new MouseEvent('mouseup', o));
    el.dispatchEvent(new MouseEvent('click', o));
    await sleep(350);
  }
  async function type(text) {
    const ta = $('#cmt');
    await to(ta, .2, .5, 450); await click();
    for (const ch of text) { ta.value += ch; await sleep(42); }
    await sleep(250);
  }
  const el = sel => domOf(elBySel(cur(), sel).id);
  const act = k => document.querySelector(`#card [data-act="${k}"]`);

  await sleep(700);

  // 1 – point at things on the rendered result
  await caption(TXT.point);
  await to(el('html:css:#hero > h1'), .35, .5, 900); await sleep(500);
  await to(el('html:css:#hero > p'), .4, .5); await sleep(500);
  await to(el('html:css:#features > div > article:nth-of-type(1) > p'), .4, .5); await sleep(700);

  // 2 – feedback
  await caption(TXT.feedback);
  await to(el('html:css:#hero > p'), .45, .4); await click(); await sleep(500);
  await type(TXT.typedRephrase);
  await to(act('rephrase'), .5, .5); await sleep(200); await click(); await sleep(1100);

  // 3 – quality, separate from feedback
  await caption(TXT.quality);
  await to(el('html:css:#features > div > article:nth-of-type(3) > p'), .4, .5); await click(); await sleep(500);
  await to(document.querySelector('#card [data-star="4"]'), .5, .5); await sleep(150); await click(); await sleep(1300);
  await to(document.querySelector('#card [data-close]'), .5, .5, 500); await click(); await sleep(300);

  // 4 – the AI asks
  await caption(TXT.ask);
  await to(el('html:css:#features > div > article:nth-of-type(2) > p'), .4, .5); await click(); await sleep(1600);
  await type(TXT.typedAnswer);
  await to(act('note'), .5, .5); await sleep(200); await click(); await sleep(1100);

  // 5 – stale approval in Sphinx-Needs docs
  await caption(TXT.stale);
  await to(document.querySelector('[data-file="requirements.rst"]'), .3, .5, 800); await click(); await sleep(700);
  await to(el('sphinx-needs:REQ_002').querySelector('.nhead'), .35, .5, 800); await click(); await sleep(3200);
  closeUI(); await sleep(200);

  // 6 – freeze alarm in code
  await caption(TXT.freeze);
  await to(document.querySelector('[data-file="loader.py"]'), .3, .5, 800); await click(); await sleep(700);
  await to(lineEls()[5].querySelector('.code'), .2, .5, 800); await click(); await sleep(3400);

  // 7 – end card
  cap.classList.remove('on');
  const end = document.createElement('div'); end.id = 'dend';
  end.innerHTML = `<img src="assets/deciwa.webp" alt=""><b>deciwa</b><span>decision watcher</span><small>${TXT.end}</small>`;
  document.body.append(end); await frame(); end.classList.add('on');
  await sleep(3200);
  window.__demoDone = true;
}
</script>
</body>
</html>
