[project]
name = "deciwa-sphinx"
version = "0.0.1"
description = "deciwa for Sphinx: review built pages, elements incl. Sphinx-Needs"
requires-python = ">=3.12"
dependencies = ["deciwa-core", "deciwa-ui", "sphinx>=9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deciwa"]

[tool.uv.sources]
deciwa-core = { workspace = true }
deciwa-ui = { workspace = true }
